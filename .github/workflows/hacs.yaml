name: ✅ HACS Validation

on:
    push:
        branches:
            - main
    pull_request:
    schedule:
        - cron: "0 0 * * *"
    workflow_dispatch:

jobs:
    validate-hacs:
        # Forks do not inherit the upstream issue tracker and topics.
        if: github.event.repository.fork == false
        runs-on: "ubuntu-latest"
        steps:
            - uses: "actions/checkout@v7.0.1"
            - name: HACS validation
              uses: "hacs/action@main"
              with:
                  category: "integration"
                  ignore: "license"
