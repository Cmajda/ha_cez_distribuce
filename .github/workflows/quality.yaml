name: 🔍 Code Quality

on:
    push:
        branches:
            - main
    pull_request:
    workflow_dispatch:

jobs:
    pre-commit:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: actions/setup-python@v7.1.0
              with:
                  python-version: "3.14"
            - name: Install uv
              uses: astral-sh/setup-uv@v10.3.3
            - name: Cache pre-commit environments
              uses: actions/cache@v6.1.0
              with:
                  path: ~/.cache/pre-commit
                  key: "${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}"
                  restore-keys: |
                      ${{ runner.os }}-pre-commit-
            - name: Install pre-commit
              run: python -m pip install "pre-commit~=4.5.1"
            - name: Run pre-commit
              run: pre-commit run --show-diff-on-failure --color=always --all-files

    validate-integrations:
        runs-on: ubuntu-latest
        needs: pre-commit
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: actions/setup-python@v7.1.0
              with:
                  python-version: "3.14"
            - name: Check integration structure
              run: |
                  # Verify required files exist
                  test -f custom_components/cez_hdo/__init__.py
                  test -f custom_components/cez_hdo/manifest.json
                  test -f hacs.json
                  test -f README.md
                  echo "✅ All required files present"

                  # Verify no Python syntax errors
                  python -m py_compile custom_components/cez_hdo/*.py
                  echo "✅ Python syntax validation passed"
